<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>เว็บไซต์โรงพยาบาลกองบิน 5</title>
<script src="config.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --brand:#1d4fd8;--brand-2:#4a86ff;--brand-d:#12328f;--brand-l:#eaf2ff;--brand-m:#cfe0ff;--on-brand:#fff;
  --accent:#3b9bff;--accent-d:#2e79c7;--on-accent:#fff;--hero-hl:#8fc4ff;
  --primary:#1d4fd8;--primary-text:#fff;
  --hero-a:#cfe0ff;--hero-ov1:rgba(240,246,255,.95);--hero-ov2:rgba(240,246,255,0);
  --bg:#eaf3ff;--bg2:#f6faff;--btn:#1d4fd8;--btn-2:#4a86ff;--btn-text:#fff;--ink:#14244a;--muted:#62729a;--line:#dde7fb;--card:#fff;--radius:22px;
  --sh:rgba(29,79,216,.14);
  --shadow:0 10px 30px rgba(29,79,216,.12);
  --serif:'Noto Sans Thai',sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:'Noto Sans Thai',sans-serif;color:var(--ink);background:var(--bg);font-size:15px;line-height:1.55}
/* ลูกเล่นพื้นหลัง: วงกลมโบเก้นุ่ม ๆ */
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:
  radial-gradient(circle 90px at 3% 32%,rgba(255,255,255,.95),rgba(255,255,255,0)),
  radial-gradient(circle 110px at 98% 46%,rgba(110,165,255,.32),rgba(110,165,255,0)),
  radial-gradient(circle 130px at 1% 78%,rgba(110,165,255,.26),rgba(110,165,255,0)),
  radial-gradient(circle 100px at 92% 92%,rgba(255,255,255,.95),rgba(255,255,255,0)),
  linear-gradient(180deg,var(--bg) 0%,var(--bg2) 55%,var(--bg) 100%)}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
h1,h2,h3,h4,p{margin:0}
a{color:var(--primary)}
.i{width:1.25em;height:1.25em;flex:0 0 auto;vertical-align:-.25em}
.wrap{max-width:1240px;margin:0 auto;padding:0 28px}
.pg{padding-top:30px;padding-bottom:10px}
/* Header */
.hdr{background:rgba(255,255,255,.78);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);position:sticky;top:0;z-index:50;box-shadow:0 1px 0 rgba(255,255,255,.9),0 8px 24px rgba(29,79,216,.07)}
.hdr .wrap{display:flex;align-items:center;gap:18px;min-height:78px;max-width:1480px}
.logo-b{display:flex;align-items:center;gap:12px;border:0;background:none;cursor:pointer;text-align:left;padding:0;color:var(--brand-d);flex:0 0 auto;min-width:0}
.lgc{width:54px;height:54px;border-radius:50%;overflow:hidden;background:#fff;border:2px solid var(--brand-m);box-shadow:0 4px 12px var(--sh);display:grid;place-items:center;font-weight:700;font-family:var(--serif);font-size:24px;color:var(--brand);flex:0 0 54px}
.lgc img{width:100%;height:100%;object-fit:cover;display:block}
.logo-b>span:last-child{display:block;min-width:0}
.logo-b b{display:block;font-family:var(--serif);font-weight:700;font-size:19px;line-height:1.3;white-space:nowrap}
.logo-b small{display:block;color:var(--muted);font-size:12px;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:260px}
.hnav{display:flex;align-items:center;gap:1px;margin-left:auto;flex:0 1 auto;min-width:0;background:rgba(255,255,255,.7);border:1px solid rgba(255,255,255,.95);border-radius:999px;padding:5px;box-shadow:0 6px 20px var(--sh)}
.hnav button{border:0;background:none;cursor:pointer;font-weight:600;font-size:13px;color:var(--ink);padding:8px 11px;border-radius:999px;white-space:nowrap;transition:background .15s,color .15s}
.hnav button:hover{background:var(--brand-l);color:var(--brand)}
.hnav button.active{background:linear-gradient(135deg,var(--brand-2),var(--brand));color:var(--on-brand);box-shadow:0 6px 14px var(--sh)}
.hdr-r{display:flex;align-items:center;gap:6px;flex:0 0 auto}
.hdr-r .adm{margin-right:8px;white-space:nowrap}
.ib{width:42px;height:42px;border:1px solid rgba(255,255,255,.95);background:rgba(255,255,255,.75);box-shadow:0 4px 14px var(--sh);border-radius:50%;cursor:pointer;display:grid;place-items:center;color:var(--brand)}
.ib:hover{background:#fff}
.ib .i{width:20px;height:20px}
.tb-menu{display:none}
/* Components */
.card{background:rgba(255,255,255,.86);border:1px solid rgba(255,255,255,.95);border-radius:var(--radius);box-shadow:var(--shadow);padding:22px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:999px;padding:10px 22px;cursor:pointer;font-weight:600;background:linear-gradient(135deg,var(--btn-2),var(--btn));color:var(--btn-text);box-shadow:0 6px 16px var(--sh);transition:filter .15s,transform .05s}
.btn .i{width:1.05em;height:1.05em}
.btn:hover{filter:brightness(1.08)}.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn.ghost{background:var(--brand-l);color:var(--brand);box-shadow:none}
.btn.danger{background:#ffe3e6;color:#b4232f;box-shadow:none}
.btn.gold{background:linear-gradient(135deg,var(--accent),var(--accent-d));color:var(--on-accent)}
.btn.line{background:rgba(255,255,255,.92);border:1.5px solid var(--brand-m);color:var(--brand);padding:8px 22px;box-shadow:0 6px 16px var(--sh)}
.btn.out{background:#fff;border:1.5px solid var(--brand-m);color:var(--brand);padding:8px 18px;box-shadow:none}
.btn.sm{padding:6px 14px;font-size:13px}
.btn.out.sm{padding:5px 13px}
.btn.block{width:100%}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
input[type=text],input[type=number],input[type=date],input[type=password],select,textarea{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:10px 14px;background:#fff}
textarea{min-height:90px;resize:vertical}
label.f{display:block;font-weight:600;font-size:13.5px;margin-bottom:5px}
.field{margin-bottom:14px}
.req{color:#d6293b}
.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:0 16px}
.page-title{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.page-title h2{font-size:25px;font-family:var(--serif);font-weight:700;color:var(--brand-d)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.chip{display:inline-block;padding:2px 12px;border-radius:999px;background:var(--brand-l);color:var(--brand);font-size:12.5px;font-weight:500}
.empty{text-align:center;color:var(--muted);padding:44px 16px}
.empty .big{font-size:42px;margin-bottom:6px}
/* Home */
.eyebrow{color:var(--accent-d);font-size:12.5px;font-weight:700;letter-spacing:.06em}
.h2s{font-family:var(--serif);font-size:clamp(24px,3vw,32px);color:var(--brand-d);margin-top:4px;line-height:1.3;font-weight:700}
.sh{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.hero2{position:relative;min-height:480px;color:var(--ink);background:linear-gradient(135deg,#f6faff,#d6e6ff);overflow:hidden;padding-bottom:70px;border-radius:0 0 44px 44px}
.hs{position:absolute;inset:0;background-size:cover;background-position:center;opacity:0;transition:opacity .9s}
.hs.on{opacity:1}
.hero2::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,var(--hero-ov1) 0%,var(--hero-ov1) 28%,var(--hero-ov2) 78%);z-index:1}
.hero2::after{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;background:
  radial-gradient(circle 60px at 6% 22%,rgba(90,150,255,.34),rgba(90,150,255,0)),
  radial-gradient(circle 80px at 93% 12%,rgba(90,150,255,.30),rgba(90,150,255,0)),
  radial-gradient(circle 100px at 97% 78%,rgba(70,130,255,.28),rgba(70,130,255,0)),
  radial-gradient(circle 70px at 3% 84%,rgba(255,255,255,.85),rgba(255,255,255,0))}
.hero2 .art{position:absolute;right:9%;top:50%;transform:translateY(-62%);width:300px;z-index:1}
.hero2 .art svg{width:100%;display:block}
.hero-in{position:relative;z-index:2;min-height:410px;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;padding-top:20px}
.hero-in h1{font-family:var(--serif);font-size:clamp(32px,4.8vw,56px);line-height:1.25;font-weight:800;max-width:680px;color:var(--brand-d)}
.hero-in h1 em{font-style:normal;color:var(--accent);display:block}
.hero-in p{margin-top:16px;max-width:520px;font-size:16.5px;color:#3a4d78}
.hero-btns{display:flex;gap:14px;flex-wrap:wrap;margin-top:26px}
/* ปุ่มเลื่อนหน้าปก: วงกลมเล็ก โปร่งนิด ๆ ใช้ไอคอน chevron */
.hnv{position:absolute;top:calc(50% - 30px);width:42px;height:42px;border-radius:50%;border:1px solid rgba(255,255,255,.9);background:rgba(255,255,255,.7);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);color:var(--brand);z-index:3;cursor:pointer;display:grid;place-items:center;padding:0;box-shadow:0 4px 12px var(--sh);opacity:.75;transition:opacity .15s,background .15s,transform .15s}
.hnv .i{width:20px;height:20px}
.hnv:hover{opacity:1;background:#fff;transform:scale(1.06)}
.hnv.prv{left:20px}.hnv.nx{right:20px}
.hdots{position:absolute;bottom:88px;left:50%;transform:translateX(-50%);display:flex;gap:8px;z-index:3}
.hdots i{width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.9);box-shadow:0 0 0 1px rgba(29,79,216,.25)}.hdots i.on{background:var(--accent);width:22px;border-radius:9px}
.strip-w{margin-top:-62px;position:relative;z-index:5}
.strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}
.strip button{display:flex;align-items:center;gap:14px;padding:16px;border:1px solid rgba(255,255,255,.95);background:rgba(255,255,255,.84);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-radius:20px;text-align:left;cursor:pointer;box-shadow:0 12px 28px var(--sh);transition:transform .15s,background .15s}
.strip button:hover{transform:translateY(-3px);background:#fff}
.strip .qi{width:50px;height:50px;border-radius:15px;display:grid;place-items:center;color:#fff;flex:0 0 50px;background:linear-gradient(135deg,#5b95ff,#2358e6);box-shadow:0 8px 16px rgba(37,99,235,.28)}
.strip .qi .i{width:26px;height:26px}
.strip button:nth-child(5n+2) .qi{background:linear-gradient(135deg,#3be0c0,#0ea58a);box-shadow:0 8px 16px rgba(14,165,138,.28)}
.strip button:nth-child(5n+3) .qi{background:linear-gradient(135deg,#ffbe5c,#f08a12);box-shadow:0 8px 16px rgba(240,138,18,.28)}
.strip button:nth-child(5n+4) .qi{background:linear-gradient(135deg,#a77bff,#6d3df0);box-shadow:0 8px 16px rgba(109,61,240,.28)}
.strip button:nth-child(5n+5) .qi{background:linear-gradient(135deg,#ff8ab4,#e0407a);box-shadow:0 8px 16px rgba(224,64,122,.28)}
.strip b{display:block;font-size:13.5px;color:var(--brand-d);line-height:1.3}
.strip div span{display:block;font-size:12.5px;color:var(--muted);line-height:1.4}
.strip .qa{margin-left:auto;color:var(--brand);display:flex;font-style:normal}
.strip .qa .i{width:18px;height:18px}
/* หน้าหลัก: 3 คอลัมน์ 1:2:1 */
.home3-w{padding-top:44px}
.home3{display:grid;grid-template-columns:1fr 2fr 1fr;gap:24px;align-items:start}
.h3c{display:flex;flex-direction:column;gap:22px;min-width:0}
.bx{background:rgba(255,255,255,.84);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-radius:var(--radius);box-shadow:var(--shadow);border:1px solid rgba(255,255,255,.95);overflow:hidden}
.bx-hd{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:14px 18px;background:linear-gradient(90deg,rgba(234,242,255,.9),rgba(255,255,255,.4));border-bottom:1px solid var(--line)}
.bx-hd h3{display:flex;align-items:center;gap:10px;font-family:var(--serif);font-weight:700;font-size:18px;color:var(--brand-d)}
.bx-hd h3 .i{width:34px;height:34px;padding:7px;border-radius:11px;background:linear-gradient(135deg,var(--brand-2),var(--brand));color:#fff;box-shadow:0 6px 12px var(--sh)}
.bx-bd{padding:16px 18px}
.bx .card{box-shadow:none;padding:0;background:transparent;border:0}
.dir-im{aspect-ratio:4/5;background:var(--brand-l);display:grid;place-items:center}
.dir-im img{width:100%;height:100%;object-fit:cover;object-position:top;display:block}
.dir-ph .i{width:90px;height:90px;color:var(--brand-m)}
.dir-cap{padding:14px 16px;text-align:center;background:linear-gradient(135deg,var(--brand),var(--brand-d));color:var(--on-brand);border-top:4px solid var(--accent)}
.dir-cap b{display:block;font-family:var(--serif);font-weight:700;font-size:18px;line-height:1.35;overflow-wrap:anywhere}
.dir-cap span{font-size:13.5px;opacity:.9}
.inf-i{padding:9px 0;border-bottom:1px dashed var(--line)}
.inf-i:first-child{padding-top:0}
.inf-i small{display:block;color:var(--muted);font-size:12.5px}
.inf-i b{display:block;font-weight:600;overflow-wrap:anywhere;white-space:pre-line}
.inf-btn{margin-top:14px}
.aw-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px}
.aw-grid .gc{box-shadow:0 6px 16px var(--sh);border:1px solid var(--line)}
.aw-grid .gc .tx b{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
/* สไลด์ข่าวประชาสัมพันธ์ / ภาพกิจกรรม (หน้าหลัก) */
.hc-st{position:relative}
.hc-im{position:relative;aspect-ratio:16/9;border-radius:18px;overflow:hidden;background:var(--brand-l);cursor:zoom-in;box-shadow:0 8px 20px var(--sh)}
.hc-im img{width:100%;height:100%;object-fit:cover;display:block}
.hc-im em{position:absolute;right:10px;top:10px;background:rgba(18,50,143,.7);color:#fff;border-radius:999px;font-style:normal;padding:1px 12px;font-size:12.5px}
/* ปุ่มเลื่อนสไลด์ข่าวประชาสัมพันธ์ / ภาพกิจกรรม: วงกลมเล็ก เรียบ ๆ */
.hc-nv{position:absolute;top:50%;transform:translateY(-50%);width:36px;height:36px;border-radius:50%;border:1px solid rgba(255,255,255,.9);background:rgba(255,255,255,.82);color:var(--brand);box-shadow:0 3px 10px rgba(18,50,143,.2);cursor:pointer;z-index:2;display:grid;place-items:center;padding:0;opacity:.8;transition:opacity .15s,background .15s}
.hc-nv .i{width:18px;height:18px}
.hc-nv:hover{opacity:1;background:#fff}
.hc-nv.prv{left:8px}.hc-nv.nx{right:8px}
.hc-dots{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);display:flex;gap:6px;z-index:2;pointer-events:none}
.hc-dots i{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.7)}
.hc-dots i.on{background:#fff;width:20px;border-radius:8px}
.hc-cap{padding:14px 4px 2px}
.hc-cap b{display:block;font-family:var(--serif);font-weight:700;font-size:18px;line-height:1.4;overflow-wrap:anywhere;color:var(--ink)}
.hc-cap small{display:block;color:var(--muted);font-size:13px;margin-top:2px}
.hc-cap p{margin-top:6px;line-height:1.7;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.hc-cap .row{margin-top:10px}
/* ข่าวประชาสัมพันธ์: การ์ดรูปเต็มสัดส่วน A4 เรียงต่อกัน เลื่อนอัตโนมัติ */
.prs-w{position:relative}
.prs-w .hc-nv{top:36%}
.prs{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;scroll-behavior:smooth;scrollbar-width:none;padding-bottom:4px}
.prs::-webkit-scrollbar{display:none}
.prc{flex:0 0 calc((100% - 28px)/3);scroll-snap-align:start;min-width:0}
.prc-im{aspect-ratio:210/297;background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;cursor:zoom-in;box-shadow:0 8px 20px var(--sh);display:grid;place-items:center}
.prc-im img{width:100%;height:100%;object-fit:contain;display:block}
.prc-cap{padding:10px 2px 0}
.prc-cap b{display:block;font-weight:700;font-size:14.5px;line-height:1.4;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.prc-cap small{display:block;color:var(--muted);font-size:12.5px;margin-top:2px}
.prc-cap p{margin-top:4px;font-size:13px;line-height:1.55;color:var(--muted);overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.prc-cap .row{margin-top:8px}
@media (max-width:600px){.prc{flex-basis:calc((100% - 14px)/2)}}
/* เว็บไซต์ที่เกี่ยวข้อง (คอลัมน์ขวา) */
.lk-list{display:flex;flex-direction:column;gap:10px}
.lkw{display:flex;flex-direction:column;gap:6px}
.lkw .row{justify-content:flex-end}
.lk-row{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:16px;background:rgba(255,255,255,.75);border:1px solid var(--line);color:var(--ink);text-decoration:none;transition:border-color .15s,transform .15s,box-shadow .15s}
a.lk-row:hover,button.lk-row:hover{border-color:var(--brand-2);transform:translateX(3px);box-shadow:0 6px 16px var(--sh)}
button.lk-row{width:100%;font:inherit;text-align:left;cursor:pointer}
.lk-go{margin-left:auto;display:flex;color:var(--brand)}
.lk-logo{width:44px;height:44px;display:grid;place-items:center;color:var(--brand);flex:0 0 44px}
.lk-logo img{width:100%;height:100%;object-fit:contain;display:block}
.lk-logo .i{width:42px;height:42px;padding:9px;border-radius:13px;background:#e4eeff;color:#2563eb}
.lk-list>.lk-row:nth-child(4n+2) .lk-logo .i{background:#dcf7f1;color:#0e9a82}
.lk-list>.lk-row:nth-child(4n+3) .lk-logo .i{background:#fff0dc;color:#e07a12}
.lk-list>.lk-row:nth-child(4n+4) .lk-logo .i{background:#efe6ff;color:#6d3df0}
.lk-name{font-weight:600;line-height:1.35;font-size:14.5px;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
/* หน้าข้อมูลโรงพยาบาล (สไตล์ "เกี่ยวกับเรา") */
.ab-hero{text-align:center;padding:46px 20px;border-radius:32px;background:linear-gradient(135deg,var(--brand-d),var(--brand));border-bottom:5px solid var(--accent);box-shadow:var(--shadow)}
.ab-hero h2{font-family:var(--serif);font-weight:800;font-size:clamp(28px,4vw,42px);color:var(--on-brand);line-height:1.3}
.ab-hero p{margin-top:8px;color:var(--hero-hl);font-size:17px}
.ab-filter{display:flex;gap:14px;align-items:center;flex-wrap:wrap;background:rgba(255,255,255,.84);border:1px solid rgba(255,255,255,.95);border-radius:26px;padding:16px 18px;margin-top:24px;box-shadow:0 6px 18px var(--sh)}
.ab-search{display:flex;align-items:center;gap:8px;flex:1 1 260px;max-width:420px;background:var(--bg2);border:1.5px solid var(--line);border-radius:999px;padding:0 16px;color:var(--muted)}
.ab-search input[type=text]{border:0;background:transparent;padding:10px 4px;outline:0;border-radius:0}
.ab-tabs{display:flex;gap:10px;flex-wrap:wrap;flex:1 1 100%;justify-content:center}
.ab-tabs button{border:1.5px solid var(--line);background:var(--bg2);border-radius:999px;padding:8px 18px;cursor:pointer;font-weight:600;font-size:14px;color:var(--ink);transition:background .15s,border-color .15s}
.ab-tabs button:hover{border-color:var(--accent)}
.ab-tabs button.on{background:linear-gradient(135deg,var(--brand-2),var(--brand));border-color:transparent;color:var(--on-brand);box-shadow:0 0 0 4px rgba(74,134,255,.2)}
.ab-tabs button.add{border-style:dashed;border-color:var(--brand);color:var(--brand);background:#fff}
.ab-wrap{background:rgba(255,255,255,.84);border:1px solid rgba(255,255,255,.95);border-radius:32px;padding:28px;margin-top:24px;box-shadow:0 6px 18px var(--sh);display:flex;flex-direction:column;gap:22px}
.ab-card{border:1px solid var(--line);border-radius:26px;padding:34px 44px 38px;background:#fff}

/* Footer */
.foot{background:linear-gradient(135deg,var(--brand),var(--brand-d));color:var(--on-brand);margin-top:60px;padding-top:46px;font-size:13.5px;border-radius:44px 44px 0 0}

.foot .fl{display:block;color:inherit;opacity:.88;background:none;border:0;padding:0;margin-bottom:9px;cursor:pointer;text-align:left;font-size:13.5px}

/* Stats */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-top:18px}

.cls .mw{display:flex;justify-content:space-between;color:var(--muted);font-size:14px;margin-bottom:8px}
.s1{background:#ece4ff}.s1 .ic{background:#6d4bd1}.s2{background:#ffe3ee}.s2 .ic{background:#d6407a}
.s3{background:#e0f5e4}.s3 .ic{background:#2f9e54}.s4{background:#ffeccf}.s4 .ic{background:#e07a12}
.s5{background:#dcecff}.s5 .ic{background:#1f6fd6}.s6{background:#d8f6ee}.s6 .ic{background:#10977a}

.car{position:relative;border-radius:18px;overflow:hidden;background:#e8f0ff;aspect-ratio:16/9;max-height:70vh;width:100%;box-shadow:0 8px 20px var(--sh)}
.car .slide{position:absolute;inset:0;opacity:0;transition:opacity .5s;display:flex;align-items:center;justify-content:center}

.car .slide{cursor:zoom-in}

.dots{position:absolute;bottom:10px;right:16px;display:flex;gap:6px}

table{width:100%;border-collapse:collapse;min-width:480px}

/* Gallery */
.tabs{display:inline-flex;background:var(--brand-l);border-radius:999px;padding:4px;margin-bottom:16px}
.tabs button{border:0;background:transparent;padding:8px 22px;border-radius:999px;cursor:pointer;font-weight:600;color:var(--muted)}
.tabs button.on{background:linear-gradient(135deg,var(--btn-2),var(--btn));color:var(--btn-text)}
.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:16px}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}

.pager{display:flex;gap:6px;justify-content:center;margin-top:20px;flex-wrap:wrap}
.pager button{min-width:38px;height:38px;border-radius:50%;border:0;background:var(--brand-l);cursor:pointer;font-weight:600}
.pager button.on{background:linear-gradient(135deg,var(--btn-2),var(--btn));color:var(--btn-text)}
.pv-list{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}
.pv{position:relative;width:96px;height:96px;border-radius:14px;overflow:hidden;background:var(--brand-l);font-size:12px;display:grid;place-items:center;text-align:center;padding:4px;word-break:break-all}
.pv img{width:100%;height:100%;object-fit:cover}
.pv button{position:absolute;top:3px;right:3px;width:22px;height:22px;border-radius:50%;border:0;background:rgba(0,0,0,.65);color:#fff;cursor:pointer;line-height:1}
.status{margin-top:10px;font-weight:500}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.thumbs img{width:88px;height:68px;object-fit:cover;border-radius:10px;cursor:pointer;background:var(--brand-l)}

.ov{position:fixed;inset:0;background:rgba(10,28,80,.5);display:none;align-items:center;justify-content:center;padding:16px;z-index:100}
.ov.show{display:flex}
.modal{background:#fff;border-radius:26px;width:100%;max-width:560px;max-height:92vh;display:flex;flex-direction:column;box-shadow:0 20px 50px rgba(10,28,80,.3)}
.modal.wide{max-width:760px}
.modal header{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px}
.modal header h3{font-size:18px}
.modal header button{border:0;background:var(--brand-l);color:var(--brand);width:34px;height:34px;border-radius:50%;cursor:pointer}
.modal .bd{padding:20px 22px;overflow-y:auto}

.toast{background:#16324f;color:#fff;padding:12px 18px;border-radius:16px;box-shadow:0 8px 20px rgba(0,0,0,.25);max-width:340px}

#lb .prv{left:14px}#lb .nx{right:14px}

.presets{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.presets button.sw{width:34px;height:34px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1.5px var(--line);cursor:pointer}
input[type=color]{width:56px;height:40px;border:1.5px solid var(--line);border-radius:12px;padding:3px;background:#fff;cursor:pointer}
.prev-img{width:64px;height:64px;border-radius:14px;object-fit:contain;background:var(--brand-l);border:1px solid var(--line)}
.set-sec{margin-bottom:18px}.set-sec h3{margin-bottom:14px;font-size:18px}
.mini{border-radius:14px;overflow:hidden;border:1px solid var(--line)}
.mini-h{background:#fff;padding:8px 12px;font-weight:700;color:var(--brand);font-family:var(--serif);display:flex;justify-content:space-between}
.mini-hero{background:linear-gradient(90deg,var(--brand-d),var(--brand));color:#fff;padding:20px 14px;font-family:var(--serif);font-weight:700;font-size:18px;line-height:1.3}

.mini-body{background:var(--bg);padding:12px;display:flex;gap:8px;align-items:center}
.print-only{display:none}
.hexin{width:120px!important;font-variant-numeric:tabular-nums}
a.btn{text-decoration:none}

.ml-row{display:flex;align-items:center;gap:8px;padding:8px 12px;border:1px solid var(--line);border-radius:14px;background:#fbfdff;margin-bottom:8px}
.ml-row b{flex:1;min-width:0;font-weight:600;overflow-wrap:anywhere}
.lbl-add{margin-left:8px;vertical-align:middle}

.dc-head{display:flex;align-items:center;justify-content:space-between;gap:18px;flex-wrap:wrap;padding-bottom:22px;border-bottom:1px solid var(--line)}
.dc-head h2{font-family:var(--serif);font-weight:800;font-size:clamp(24px,3.2vw,38px);color:var(--brand-d);line-height:1.3}

.dc-filters select{width:auto;min-width:190px;border-radius:999px;padding:12px 16px;font-weight:600}
.dc-filters .ab-search{min-width:260px;border-radius:999px;background:#fff}
.dc-card{margin-top:26px;background:rgba(255,255,255,.88);border:1px solid rgba(255,255,255,.95);border-radius:26px;box-shadow:var(--shadow);overflow:hidden}
.dc-top{padding:18px 28px;background:var(--brand-l);color:var(--brand);font-weight:700;font-size:14.5px}
.dc-row{display:flex;align-items:center;gap:20px;padding:22px 28px;border-top:1px solid var(--line)}
.dc-top+.dc-row{border-top:0}
.dc-ic{width:64px;height:64px;border-radius:18px;background:#fdeeee;color:#c62828;display:grid;place-items:center;flex:0 0 64px;box-shadow:0 3px 10px rgba(198,40,40,.12)}

.dc-ic .i{width:30px;height:30px}

.dc-meta{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:6px;font-size:13px;color:var(--muted)}
.dc-code{background:var(--brand-l);color:var(--brand);border-radius:8px;padding:2px 12px;font-weight:700;font-size:13px}
.dc-t{display:block;font-size:19px;line-height:1.4;overflow-wrap:anywhere}
.dc-act{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end}
.dc-file{font-size:13px;color:var(--muted);margin-top:6px;overflow-wrap:anywhere}

.ct-grid{display:grid;grid-template-columns:1fr 1.5fr;gap:24px;margin-top:24px;align-items:start}
.ct-list{display:flex;flex-direction:column;gap:14px;min-width:0}

a.ct-item:hover{border-color:var(--accent);transform:translateY(-2px)}
.ct-ic{width:48px;height:48px;border-radius:15px;background:var(--brand-l);color:var(--brand);display:grid;place-items:center;flex:0 0 48px}
.ct-ic.line{background:#e3f7e8;color:#06a94d}.ct-ic.fb{background:#e5eefc;color:#1877f2}
.ct-tx{min-width:0}
.ct-tx small{display:block;color:var(--muted);font-size:12.5px}
.ct-tx b{display:block;font-weight:600;overflow-wrap:anywhere;white-space:pre-line}
.map-box{height:420px;background:var(--brand-l);position:relative;isolation:isolate}
.map-box.pick{height:340px;border-radius:16px;overflow:hidden;border:1px solid var(--line)}
.map-act{display:flex;gap:10px;flex-wrap:wrap;padding:14px 18px;border-top:1px solid var(--line)}
.map-hint{font-size:13px;color:var(--muted);margin:8px 0 12px}
@media (max-width:1480px){

  .hnav.open{display:flex}

}
@media (max-width:1000px){
  .home3{grid-template-columns:1fr}

}
@media (max-width:900px){
  .wrap{padding:0 18px}
  .hnav{padding:8px 18px 16px}
  .foot-g{grid-template-columns:repeat(2,1fr)}
  .grid2{grid-template-columns:1fr}
  .car .nv{width:38px;height:38px}
  .hero2{min-height:0;border-radius:0 0 30px 30px}
  .hero-in{min-height:340px}

  .hero2 .art{display:none}

  .logo-b b{font-size:16px;white-space:normal}
  .hdr-r .adm span{display:none}
  .ab-t .i{display:none}

}

  .print-only{display:block;text-align:center;margin:8px 0}

}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

const LISTCFG = {
  dept:    { key: 'deptList',    title: 'กลุ่มงาน',                   field: 'Dept',     none: false, get: () => DEPTS.slice() },
  group:   { key: 'groupList',   title: 'แผนก/หน่วยงาน',        field: 'Group',    none: true,  get: () => GROUPS.slice() },
  div:     { key: 'divList',     title: 'สายงาน',     field: 'Division', none: true,  get: () => DIVS.slice() },
  docdept: { key: 'docDeptList', title: 'กลุ่มงานของเอกสาร',          field: 'Dept',     none: true,  get: () => DOC_DEPTS.slice() }
};
function loadLists() {
  const rd = (key, def) => {
    try {
      const v = JSON.parse(S.settings[key] || '[]');
      const a = Array.isArray(v) ? v.map(x => String(x).trim()).filter(Boolean) : [];
      return a.length ? a : def.slice();
    } catch (e) { return def.slice(); }
  };
  DEPTS = rd('deptList', DEPTS0); GROUPS = rd('groupList', GROUPS0); DIVS = rd('divList', DIVS0); DOC_DEPTS = rd('docDeptList', DOC_DEPTS0);
}
function selOptions(k, val) {
  const l = LISTCFG[k].get();
  if (val && l.indexOf(val) < 0) l.push(val); // คงค่าเดิมของข้อมูลเก่า
  return (LISTCFG[k].none ? '<option value="">ไม่ระบุ</option>' : '') +
    l.map(x => '<option value="' + esc(x) + '"' + (x === val ? ' selected' : '') + '>' + esc(x) + '</option>').join('');
}
function persistList(k, arr, after) {
  api('saveSettings', [{ [LISTCFG[k].key]: JSON.stringify(arr) }, S.pwd], 'กำลังบันทึก...').then(r => {
    if (!check(r)) return;
    S.settings = r.settings || S.settings; loadLists();
    if (after) after(r);
  }).catch(() => {});
}
/* เพิ่มรายการใหม่ด่วนจากในหน้าต่างเพิ่ม/แก้ไข (บุคลากร / เอกสาร) */
function quickAdd(k) {
  const cfg = LISTCFG[k];
  const name = String(prompt('เพิ่ม' + cfg.title + 'ใหม่ (พิมพ์ชื่อ):') || '').trim();
  if (!name) return;
  const cur = cfg.get();
  const fill = () => { const el = $('[data-it="' + cfg.field + '"]'); if (el) el.innerHTML = selOptions(k, name); };
  if (cur.indexOf(name) >= 0) { fill(); toast('มีรายการนี้อยู่แล้ว (เลือกให้แล้ว)', ''); return; }
  persistList(k, cur.concat([name]), () => { fill(); toast('เพิ่ม' + cfg.title + 'สำเร็จ', 'ok'); });
}
/* หน้าต่างจัดการรายการ: เพิ่ม / ลบ / เลื่อนลำดับ */
function manageList(k) {
  S.ml = { k: k, items: LISTCFG[k].get() };
  openModal('จัดการ' + LISTCFG[k].title,
    '<div class="field"><label class="f">เพิ่มรายการใหม่</label><div class="row" style="flex-wrap:nowrap"><input type="text" id="mlIn" maxlength="100" placeholder="พิมพ์ชื่อ แล้วกด Enter หรือปุ่มเพิ่ม" autocomplete="off"><button class="btn sm" type="button" data-act="mladd" style="flex:0 0 auto">+ เพิ่ม</button></div></div>' +
    '<div id="mlBody"></div>' +
    '<p class="map-hint">การลบรายการจะไม่ลบข้อมูลบุคลากร/เอกสารที่เคยใช้รายการนั้น (ยังแสดงผลตามเดิม) · หากลบทั้งหมด ระบบจะกลับไปใช้รายการเริ่มต้น</p>',
    '<button class="btn ghost" data-act="close">ยกเลิก</button><button class="btn" data-act="mlsave">บันทึก</button>');
  drawML();
  setTimeout(() => { const e = $('#mlIn'); if (e) e.focus(); }, 50);
}
function drawML() {
  const b = $('#mlBody'); if (!b || !S.ml) return;
  const a = S.ml.items, n = a.length;
  b.innerHTML = n ? a.map((x, i) => '<div class="ml-row"><b>' + esc(x) + '</b>' +
    '<button class="btn ghost sm" type="button" data-act="mlup" data-i="' + i + '" aria-label="เลื่อนขึ้น"' + (i === 0 ? ' disabled' : '') + '>▲</button>' +
    '<button class="btn ghost sm" type="button" data-act="mldown" data-i="' + i + '" aria-label="เลื่อนลง"' + (i === n - 1 ? ' disabled' : '') + '>▼</button>' +
    '<button class="btn danger sm" type="button" data-act="mldel" data-i="' + i + '">ลบ</button></div>').join('') : '<p class="sc-empty">ยังไม่มีรายการ (จะใช้ค่าเริ่มต้นของระบบ)</p>';
}
function mlAdd() {
  const e = $('#mlIn'); if (!e || !S.ml) return;
  const v = e.value.trim();
  if (!v) { toast('กรุณาพิมพ์ชื่อรายการ', 'err'); return; }
  if (S.ml.items.indexOf(v) >= 0) { toast('มีรายการนี้อยู่แล้ว', 'err'); return; }
  S.ml.items.push(v); e.value = ''; drawML(); e.focus();
}
function mlMove(i, d) {
  const a = S.ml.items, j = i + d;
  if (j < 0 || j >= a.length) return;
  const t = a[i]; a[i] = a[j]; a[j] = t; drawML();
}
function mlSave() {
  const k = S.ml.k;
  persistList(k, S.ml.items, () => { closeModal(); toast('บันทึก' + LISTCFG[k].title + 'สำเร็จ', 'ok'); render(); });
}

function safeUrl(u) {
  u = String(u || '').trim();
  if (!u) return '';
  const m = u.match(/drive\.google\.com\/file\/d\/([\w-]+)/) || u.match(/drive\.google\.com\/(?:open|uc)\?(?:[^#]*&)?id=([\w-]+)/);
  if (m) return 'https://drive.google.com/thumbnail?id=' + m[1] + '&sz=w1600';
  if (/^https?:\/\//i.test(u) || /^data:image\//i.test(u)) return u;
  return '';
}
function cssUrl(u) { return String(u).replace(/['"()\\\s]/g, c => '%' + c.charCodeAt(0).toString(16)); }
function thumb(id, w) { return 'https://drive.google.com/thumbnail?id=' + encodeURIComponent(id) + '&sz=w' + (w || 800); }
function viewUrl(id) { return 'https://drive.google.com/file/d/' + encodeURIComponent(id) + '/view'; }
function parseJ(s) { try { const v = JSON.parse(s || '[]'); return Array.isArray(v) ? v : []; } catch (e) { return []; } }
function fmtDate(s) {
  if (!s) return '';
  const d = new Date(String(s).slice(0, 10) + 'T00:00:00');
  return isNaN(d) ? esc(s) : d.toLocaleDateString('th-TH', { day: 'numeric', month: 'short', year: 'numeric' });
}
function img(src, alt, cls) { return '<img ' + (cls ? 'class="' + cls + '" ' : '') + 'src="' + esc(safeUrl(src) || PH) + '" alt="' + esc(alt || '') + '" loading="lazy">'; }
document.addEventListener('error', e => {
  const t = e.target;
  if (t && t.tagName === 'IMG' && t.src !== PH && !t.dataset.fb) { t.dataset.fb = '1'; t.src = PH; }
}, true);

let loadCount = 0;
function loading(on, msg) {
  loadCount = on ? loadCount + 1 : Math.max(0, loadCount - 1);

  $('#loading').classList.toggle('show', loadCount > 0);
}
/* เรียกฝั่งเซิร์ฟเวอร์ได้ 2 โหมด:
   1) เปิดจาก Apps Script โดยตรง -> google.script.run
   2) โฮสต์บน GitHub Pages -> fetch ไปที่ Web App (API_URL ใน config.js) */
const API_URL = ((window.APP_CONFIG || {}).API_URL || '').trim();
function rawCall(fn, args) {
  if (window.google && google.script && google.script.run) {
    return new Promise((resolve, reject) => {
      const r = google.script.run.withSuccessHandler(resolve).withFailureHandler(reject);
      try { r[fn].apply(r, args); } catch (e) { reject(e); }
    });
  }
  if (!API_URL) return Promise.reject(new Error('ยังไม่ได้ตั้งค่า API_URL ในไฟล์ config.js'));
  return fetch(API_URL, {
    method: 'POST', redirect: 'follow',

/* ===== Theme ===== */
function lum(hex) {
  let h = String(hex || '#ffffff').replace('#', '');
  if (h.length === 3) h = h.split('').map(x => x + x).join('');
  const f = v => { v /= 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); };
  return 0.2126 * f(parseInt(h.substr(0, 2), 16)) + 0.7152 * f(parseInt(h.substr(2, 2), 16)) + 0.0722 * f(parseInt(h.substr(4, 2), 16));
}
function mix(h1, h2, k) {
  const g = h => { h = h.replace('#', ''); return [0, 2, 4].map(i => parseInt(h.substr(i, 2), 16)); };
  const x = g(h1), y = g(h2);
  return '#' + x.map((v, i) => Math.round(v * (1 - k) + y[i] * k).toString(16).padStart(2, '0')).join('');
}
function rgba(hex, a) {
  const h = hex.replace('#', '');
  return 'rgba(' + [0, 2, 4].map(i => parseInt(h.substr(i, 2), 16)).join(',') + ',' + a + ')';
}
/* primary = สีเน้น (ทอง), sidebar = สีหลัก (หัวข้อ/ส่วนท้าย/ปุ่ม), bg = พื้นหลัง */
function applyTheme(c) {
  const ok = (v, d) => /^#[0-9a-f]{6}$/i.test(v) ? v : d;
  const accent = ok(c.primary, DEF.primary), brand = ok(c.sidebar, DEF.sidebar), bg = ok(c.bg, DEF.bg);
  const st = document.documentElement.style;
  const set = (k, v) => st.setProperty(k, v);
  const onB = lum(brand) > 0.5 ? '#0f172a' : '#ffffff', onA = lum(accent) > 0.5 ? '#1a1405' : '#ffffff';
  set('--brand', brand); set('--brand-d', mix(brand, '#000000', 0.28)); set('--brand-2', mix(brand, '#ffffff', 0.22));
  set('--brand-l', mix(brand, '#ffffff', 0.92)); set('--brand-m', mix(brand, '#ffffff', 0.8));
  set('--on-brand', onB);
  set('--accent', accent); set('--accent-d', mix(accent, '#000000', 0.22)); set('--on-accent', onA);
  set('--hero-hl', mix(accent, '#ffffff', 0.45));
  set('--primary', brand); set('--primary-text', onB);
  set('--btn', brand); set('--btn-2', mix(brand, '#ffffff', 0.22)); set('--btn-text', onB);
  set('--sh', rgba(brand, 0.14)); set('--shadow', '0 10px 30px ' + rgba(brand, 0.12));
  set('--bg', bg); set('--bg2', mix(bg, '#ffffff', 0.6));
  set('--hero-a', mix(brand, '#ffffff', 0.8));
  const hb = mix(bg, '#ffffff', 0.55);
  set('--hero-ov1', rgba(hb, 0.95)); set('--hero-ov2', rgba(hb, 0));
}

function prStep(d) {
  const e = $('#prs'); if (!e || !e.children.length) return;
  const w = e.children[0].getBoundingClientRect().width + 14, max = e.scrollWidth - e.clientWidth;
  if (d > 0 && e.scrollLeft >= max - 2) e.scrollTo({ left: 0 });
  else if (d < 0 && e.scrollLeft <= 2) e.scrollTo({ left: max });
  else e.scrollBy({ left: d * w });
}

  e.addEventListener('mouseenter', on); e.addEventListener('mouseleave', off);
  e.addEventListener('touchstart', on, { passive: true }); e.addEventListener('touchend', () => setTimeout(off, 3000));
  S.prTimer = setInterval(() => { if (!S.prPause && $('#prs')) prStep(1); }, 4000);

  api('saveSettings', [{ customSections: JSON.stringify(arr) }, S.pwd], 'กำลังบันทึก...').then(r => {
    if (!check(r)) return;
    S.settings = r.settings || S.settings;
    if (tab) S.sch.tab = tab;
    S.sch.q = '';
    closeModal(); toast(r.msg, 'ok'); render();
  }).catch(() => {});

function saveSec(id) {
  const t = $('[data-sec="title"]'), x = $('[data-sec="text"]');
  const title = t ? t.value.trim() : '', text = x ? x.value.trim() : '';
  if (!title) { toast('กรุณากรอกชื่อหมวดหมู่', 'err'); return; }
  const arr = getSecs();
  let sid = id;
  if (id) {
    const c = arr.find(z => String(z.id) === String(id));
    if (!c) { toast('ไม่พบหมวดหมู่ที่ต้องการแก้ไข', 'err'); return; }
    c.title = title; c.text = text;
  } else {
    sid = 's' + Date.now().toString(36);
    arr.push({ id: sid, title: title, text: text });
  }
  persistSecs(arr, 'c_' + sid);
}
function persistHidden(arr, tab, msg) {
  const want = JSON.stringify(arr);

const LF = 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/';
let leafP = null;
function loadLeaflet() {
  if (window.L && window.L.map) return Promise.resolve();
  if (leafP) return leafP;
  leafP = new Promise((res, rej) => {
    const c = document.createElement('link'); c.rel = 'stylesheet'; c.href = LF + 'leaflet.min.css'; document.head.appendChild(c);
    const sc = document.createElement('script'); sc.src = LF + 'leaflet.min.js'; sc.onload = res;
    sc.onerror = () => { leafP = null; rej(new Error('map')); };
    document.head.appendChild(sc);
  });
  return leafP;
}
const mapNum = v => { const t = String(v == null ? '' : v).trim(); if (!t) return null; const n = Number(t); return isFinite(n) ? n : null; };
const gmapsUrl = (la, ln) => 'https://www.google.com/maps?q=' + la + ',' + ln;
function initMap(elId, lat, lng, edit, onPick) {
  const el = $('#' + elId); if (!el) return;
  const has = lat != null && lng != null;
  loadLeaflet().then(() => {
    if ($('#' + elId) !== el) return;
    if (S.map) { S.map.remove(); S.map = null; }
    const m = L.map(el, { scrollWheelZoom: false }).setView(has ? [lat, lng] : [13.7563, 100.5018], has ? 16 : 6);
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '© OpenStreetMap' }).addTo(m);
    const icon = L.icon({ iconUrl: LF + 'images/marker-icon.png', iconRetinaUrl: LF + 'images/marker-icon-2x.png', shadowUrl: LF + 'images/marker-shadow.png', iconSize: [25, 41], iconAnchor: [12, 41], popupAnchor: [1, -34], shadowSize: [41, 41] });
    let mk = null;
    const make = (la, ln) => {
      mk = L.marker([la, ln], { icon: icon, draggable: !!edit }).addTo(m);
      if (edit) mk.on('dragend', () => { const p = mk.getLatLng(); onPick(p.lat, p.lng); });
    };
    if (has) make(lat, lng);
    if (edit) {
      m.on('click', ev => { if (mk) mk.setLatLng(ev.latlng); else make(ev.latlng.lat, ev.latlng.lng); onPick(ev.latlng.lat, ev.latlng.lng); });
      S.mapSet = (la, ln) => { if (mk) mk.setLatLng([la, ln]); else make(la, ln); m.setView([la, ln], 16); };
      S.mapClear = () => { if (mk) { m.removeLayer(mk); mk = null; } };
    }
    S.map = m;
  }).catch(() => {
    if ($('#' + elId) !== el) return;
    el.innerHTML = has && !edit ? '<iframe src="https://www.google.com/maps?q=' + lat + ',' + lng + '&z=16&output=embed" style="border:0;width:100%;height:100%" loading="lazy" title="แผนที่"></iframe>' : '<div class="empty"><p>โหลดแผนที่ไม่สำเร็จ</p></div>';
  });
}

const PAL = [
  ['#f6b98a', '#fff5ec', '#fde1c8', '#b4540f'], ['#9cc7f5', '#eef6ff', '#d3e7fc', '#1f5fa8'],
  ['#9fd8b1', '#eefaf1', '#d1efda', '#23784a'], ['#c3aef0', '#f5f0ff', '#e2d8fa', '#6a46b8'],
  ['#f4a9c4', '#fff0f6', '#fbd4e3', '#b02f66'], ['#8fd9d0', '#ecfaf8', '#c8efea', '#1a7d73'],

function pStaff(v) {
  const o = S.org, st = S.staff;
  const uni = (base, key) => Array.from(new Set(base.concat(st.map(p => p[key]).filter(Boolean))));
  const depts = uni(DEPTS, 'Dept'), groups = uni(GROUPS, 'Group'), divs = uni(DIVS, 'Division');
  const opts = o.mode === 'dept' ? depts : o.mode === 'group' ? groups : o.mode === 'homeroom' ? divs : [];
  if (opts.indexOf(o.val) < 0) o.val = '';
  const units = (key, names, empty) => {
    const out = names.map(n => { const l = st.filter(p => (p[key] || '') === n); return l.length ? unitHtml(n, l) : ''; }).join('');
    const rest = empty ? st.filter(p => !p[key] && !isExec(p)) : [];
    return out + (rest.length ? unitHtml(empty, rest) : '');
  };
  let body;
  if (!st.length) body = emptyHtml('👥', 'ยังไม่มีข้อมูลบุคลากร');
  else if (o.mode === 'all') {
    const ex = st.filter(isExec);
    body = (ex.length ? unitHtml('ผู้บริหาร', ex) + '<div class="org-stem"></div>' : '') +
      '<div class="org-grid">' + units('Dept', depts.filter(d => !isExec({ Dept: d })), 'ไม่ระบุกลุ่มงาน') + '</div>';
  } else if (o.mode === 'dept') {
    body = '<div class="org-grid">' + units('Dept', o.val ? [o.val] : depts, o.val ? '' : 'ไม่ระบุกลุ่มงาน') + '</div>';
  } else if (o.mode === 'group') {
    body = '<div class="org-grid">' + units('Group', o.val ? [o.val] : groups, '') + '</div>';
  } else {
    body = '<div class="org-grid">' + units('Division', o.val ? [o.val] : divs, '') + '</div>';

function readFile(file, isImg) {
  return new Promise((resolve, reject) => {
    const fr = new FileReader();
    fr.onerror = () => reject(new Error('อ่านไฟล์ไม่สำเร็จ'));
    fr.onload = () => {
      if (!isImg) { resolve({ name: file.name, mime: file.type || 'application/octet-stream', data: String(fr.result).split(',')[1] }); return; }
      const im = new Image();
      im.onerror = () => reject(new Error('ไฟล์ภาพไม่ถูกต้อง'));
      im.onload = () => {
        const mx = 1600, k = Math.min(1, mx / Math.max(im.width, im.height));
        const c = document.createElement('canvas'); c.width = Math.round(im.width * k); c.height = Math.round(im.height * k);
        c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
        const url = c.toDataURL('image/jpeg', 0.85);
        resolve({ name: file.name.replace(/\.\w+$/, '') + '.jpg', mime: 'image/jpeg', data: url.split(',')[1], preview: url });
      };
      im.src = String(fr.result);
    };
    fr.readAsDataURL(file);
  });
}
async function addFiles(input, key, isImg) {
  const files = Array.from(input.files || []);
  loading(true, 'กำลังเตรียมไฟล์...');
  try {
    for (const f of files) {
      if (f.size > 8 * 1024 * 1024) { toast('ไฟล์ ' + f.name + ' ใหญ่เกิน 8 MB', 'err'); continue; }
      S.form[key].push(await readFile(f, isImg));
    }
  } catch (e) { toast(e.message || 'เกิดข้อผิดพลาด', 'err'); }
  loading(false); input.value = ''; drawPreviews();
}
function saveRec() {
  if (S.busy) return;

  $$('[data-rf]').forEach(e => { d[e.dataset.rf] = e.value.trim(); });

  if (d.EndDate && d.EndDate < d.StartDate) { toast('วันที่สิ้นสุดต้องไม่ก่อนวันที่เริ่ม', 'err'); return; }
  d.ID = S.form.id;
  d.keepImages = S.form.oldImages.map(x => x.id); d.keepDocs = S.form.oldDocs.map(x => x.id);
  d.newImages = S.form.newImages.map(x => ({ name: x.name, mime: x.mime, data: x.data }));

    if (check(r)) {

  }).catch(() => { if (st) st.textContent = 'เกิดข้อผิดพลาด กรุณาลองใหม่'; })
    .then(() => { S.busy = false; const b = $('#btnSave'); if (b) b.disabled = false; });
}

function onHex(t) {
  let v = t.value.trim();
  if (v && v[0] !== '#') v = '#' + v;
  if (/^#[0-9a-f]{3}$/i.test(v)) v = '#' + v.slice(1).split('').map(x => x + x).join('');
  if (/^#[0-9a-f]{6}$/i.test(v)) { $('#' + t.dataset.hex).value = v.toLowerCase(); t.style.borderColor = ''; liveTheme(); }
  else t.style.borderColor = '#d6293b';
}

function safeLink(u) {
  u = String(u || '').trim();
  if (!u) return '';
  if (!/^https?:\/\//i.test(u)) u = 'https://' + u;
  try { const x = new URL(u); return /^https?:$/.test(x.protocol) ? x.href : ''; } catch (e) { return ''; }
}

    case 'hcopen': if (d.k === 'pr') viewPr(d.id); else viewRec(d.id); break;
    case 'adddoc': docModal(''); break;
    case 'editdoc': docModal(d.id); break;
    case 'savedoc': saveDoc(d.id); break;
    case 'rmdocfile': { S.docUp = null; const i = $('#docFileInfo'); if (i) i.innerHTML = docFileInfo(); const f = $('#docFile'); if (f) f.value = ''; break; }
    case 'manage': manageList(d.k); break;
    case 'quickadd': quickAdd(d.k); break;
    case 'mladd': mlAdd(); break;
    case 'mldel': S.ml.items.splice(Number(d.i), 1); drawML(); break;
    case 'mlup': mlMove(Number(d.i), -1); break;
    case 'mldown': mlMove(Number(d.i), 1); break;
    case 'mlsave': mlSave(); break;
    case 'clearpin': { ['mapLat', 'mapLng'].forEach(k => { const e = $('[data-s="' + k + '"]'); if (e) e.value = ''; }); if (S.mapClear) S.mapClear(); break; }
    case 'mypos':
      if (!navigator.geolocation) { toast('อุปกรณ์ไม่รองรับการระบุตำแหน่ง', 'err'); break; }
      navigator.geolocation.getCurrentPosition(p => {
        const la = p.coords.latitude, ln = p.coords.longitude;
        const a = $('[data-s="mapLat"]'), b = $('[data-s="mapLng"]'); if (a) a.value = la.toFixed(6); if (b) b.value = ln.toFixed(6);
        if (S.mapSet) S.mapSet(la, ln);
      }, () => toast('ไม่สามารถอ่านตำแหน่งปัจจุบันได้', 'err'));
      break;
    case 'allawards': allAwards(); break;
    case 'schtab': { S.sch.tab = d.k; S.sch.q = ''; drawSch(); break; }
    case 'schgo': S.sch.tab = d.k; S.sch.q = ''; go('school'); break;
    case 'addsec': secModal(''); break;
    case 'editsec': secModal(d.id); break;
    case 'savesec': saveSec(d.id); break;
    case 'delsec': delSec(d.id); break;
    case 'hidesec': hideSec(d.k); break;
    case 'showsec': showSec(d.k); break;
    case 'orgmode': S.org.mode = d.m; S.org.val = ''; render(); break;
    case 'retry': boot(); break;
    case 'close': closeModal(); break;
    case 'login': loginModal(''); break;
    case 'dologin': doLogin(); break;
    case 'logout': logout(); break;
    case 'heroprev': heroShow(S.hero - 1); startHero(); break;
    case 'heronext': heroShow(S.hero + 1); startHero(); break;
    case 'carprev': carShow(S.car - 1); startCar(); break;
    case 'carnext': carShow(S.car + 1); startCar(); break;
    case 'tab': S.tab = d.t; $('#tabGallery').hidden = d.t !== 'gallery'; $('#tabForm').hidden = d.t !== 'form'; $$('.tabs button').forEach(b => b.classList.toggle('on', b.dataset.t === d.t)); break;
    case 'gpage': S.gal.page = Number(d.p); drawGallery(); break;
    case 'viewrec': viewRec(d.id); break;
    case 'openlb': { const r = S.records.find(x => String(x.ID) === String(d.id)); if (r) openLb(parseJ(r.Images), Number(d.i)); break; }
    case 'lbprev': S.lb.i = (S.lb.i - 1 + S.lb.items.length) % S.lb.items.length; drawLb(); break;
    case 'lbnext': S.lb.i = (S.lb.i + 1) % S.lb.items.length; drawLb(); break;
    case 'lbclose': closeLb(); break;
    case 'editrec': loadRec(d.id); break;
    case 'delrec':
      if (!confirm('ยืนยันการลบกิจกรรมนี้?')) break;
      api('deleteRecord', [d.id, S.pwd], 'กำลังลบ...').then(r => { if (check(r)) { S.records = r.records; closeModal(); toast(r.msg, 'ok'); render(); } }).catch(() => {});
      break;
    case 'loadid': loadRec($('#srchId').value); break;
    case 'saverec': saveRec(); break;
    case 'cancelrec': resetForm(); S.tab = 'gallery'; render(); break;
    case 'clearrec': resetForm(); break;
    case 'rmold': S.form[d.k].splice(Number(d.i), 1); drawPreviews(); break;
    case 'rmnew': S.form[d.k].splice(Number(d.i), 1); drawPreviews(); break;
    case 'additem': itemModal(d.t, ''); break;
    case 'edititem': itemModal(d.t, d.id); break;
    case 'saveitem': saveItem(d.t, d.id); break;
    case 'delitem': delItem(d.t, d.id); break;
    case 'savesettings': saveSettings(); break;
    case 'preset': setColor('cSidebar', d.c); liveTheme(); break;
    case 'changepwd': changePwd(); break;
    case 'resetcolor': setColor('cSidebar', DEF.sidebar); setColor('cPrimary', DEF.primary); setColor('cBg', DEF.bg); liveTheme(); break;
    case 'print': window.print(); break;
  }
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.gal) { S.gal[t.dataset.gal] = t.value; S.gal.page = 1; drawGallery(); }
  else if (t.id === 'docQ') { S.dq.q = t.value; drawDocs(); }
  else if (t.dataset.s === 'mapLat' || t.dataset.s === 'mapLng') {
    const a = mapNum(($('[data-s="mapLat"]') || {}).value), b = mapNum(($('[data-s="mapLng"]') || {}).value);
    if (a != null && b != null && Math.abs(a) <= 90 && Math.abs(b) <= 180 && S.mapSet) S.mapSet(a, b);
  }
  else if (t.id === 'cPrimary' || t.id === 'cSidebar' || t.id === 'cBg') { setColor(t.id, t.value); liveTheme(); }
  else if (t.dataset.hex) onHex(t);
  else if (t.dataset.prev) { const p = $('#' + t.dataset.prev); if (p) { p.dataset.fb = ''; p.src = safeUrl(t.value) || PH; } }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.hex) { const c = $('#' + t.dataset.hex); if (c) { t.value = c.value; t.style.borderColor = ''; } }
  else if (t.dataset.gal && t.tagName === 'SELECT') { S.gal[t.dataset.gal] = t.value; S.gal.page = 1; drawGallery(); }
  else if (t.dataset.sf) { S.sf[t.dataset.sf] = t.value; render(); }
  else if (t.dataset.dq) { S.dq[t.dataset.dq] = t.value; drawDocs(); }
  else if (t.id === 'docFile') uploadDocFile(t.files[0]);
  else if (t.dataset.org) { S.org.val = t.value; render(); }
  else if (t.id === 'fImg') addFiles(t, 'newImages', true);
  else if (t.id === 'fDoc') addFiles(t, 'newDocs', false);
  else if (t.dataset.upload) uploadTo(t.dataset.upload, t.files[0]);
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { if (S.lb) closeLb(); else closeModal(); }
  else if (S.lb && e.key === 'ArrowRight') { S.lb.i = (S.lb.i + 1) % S.lb.items.length; drawLb(); }
  else if (S.lb && e.key === 'ArrowLeft') { S.lb.i = (S.lb.i - 1 + S.lb.items.length) % S.lb.items.length; drawLb(); }
  else if (e.key === 'Enter' && e.target.id === 'pwdIn') doLogin();
  else if (e.key === 'Enter' && e.target.id === 'mlIn') { e.preventDefault(); mlAdd(); }
});
window.addEventListener('beforeunload', () => { /* ไม่เก็บสถานะใด ๆ ลง Browser */ });

renderChrome();
boot();
})();
</script>
</body>
</html>
